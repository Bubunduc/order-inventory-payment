spring.application.name=inventory-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:saga_db}?currentSchema=${SCHEMA_NAME:inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin}
spring.rabbitmq.virtual-host=/

mybatis.mapper-locations=classpath:mapper/**/*.xml

mybatis.type-aliases-package=com.example.inventory.model
